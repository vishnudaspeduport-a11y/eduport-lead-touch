# Cloudflare Worker: serves /api/* and the built React app (Workers Static Assets).
# One deploy = API + frontend. See README "Deploy".
name = "eduport-lead-touch"
account_id = "ee558dc2a8ca2f421731d9b046ae5731"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# --- Frontend (built by `npm run build` in ../web) ---------------------------
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# --- Supabase Postgres via Hyperdrive ------------------------------------------
# Use the Supabase "Session pooler" connection string (IPv4, port 5432) - NOT the
# transaction pooler (6543) and NOT the direct db.<ref>.supabase.co host (IPv6-only):
#   wrangler hyperdrive create eduport-lead-touch-ro --connection-string \
#     "postgres://lt_app_ro.PROJECT_REF:PASSWORD@aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require"
# Paste the returned id below (or create it in the dashboard: Workers & Pages -> Hyperdrive).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_ID"
# Local dev: wrangler dev talks to this string directly (no Hyperdrive).
# Override without editing the file: WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=postgres://...
localConnectionString = "postgres://lt_app_ro:CHANGE_ME_ro@127.0.0.1:5432/eduport"

# --- Materialized-view refresh (Cron Trigger) -----------------------------------
# 15 minutes past every 2nd hour (UTC). The sync job also refreshes after each run.
[triggers]
crons = ["15 */2 * * *"]

# --- Non-secret config (secrets: wrangler secret put <NAME>) -------------------
[vars]
AUTH_MODE = "access"                                          # "access" | "dev"
ACCESS_TEAM_DOMAIN = "https://eduport.cloudflareaccess.com"   # your Zero Trust team domain
ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD"            # Access app -> Overview -> Application Audience (AUD) tag
ADMIN_EMAILS = "bi_team@eduport.ai"                           # comma list; admins see unmasked phone/email
ALLOWED_EMAIL_DOMAIN = "eduport.ai"
APP_VERSION = "1.0.0"
EXPORT_ROW_CAP = "50000"

# Local dev overrides live in .dev.vars (git-ignored), e.g. AUTH_MODE=dev
