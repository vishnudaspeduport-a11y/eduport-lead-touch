# Cloudflare Worker: serves /api/* and the built React app (Workers Static Assets).
# One deploy = API + frontend:  cd web && npm run build && cd ../api && npx wrangler deploy
name = "eduport-lead-touch"
account_id = "ee558dc2a8ca2f421731d9b046ae5731"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# --- Frontend (built by `npm run build` in ../web) ---------------------------
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# --- Database ------------------------------------------------------------------
# Set once as a Worker secret (never in this file):
#   npx wrangler secret put DATABASE_URL
#   -> paste the Supabase TRANSACTION pooler string (port 6543):
#      postgresql://postgres.PROJECT_REF:PASSWORD@aws-0-REGION.pooler.supabase.com:6543/postgres?sslmode=require
# Optional later: a Hyperdrive binding named HYPERDRIVE takes precedence when present.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "c6890bf7a94c409e88a2fbcb42ee9bf6"

# --- Materialized-view refresh: done by the sync job (GitHub Actions) every 30 min. The Worker cron was
# removed: a refresh through the pooled connection can be cut mid-transaction and leave the views locked.
[triggers]
crons = []

# --- Non-secret config ---------------------------------------------------------
[vars]
AUTH_MODE = "password"                                        # "password" (login page, accounts managed in the app) | "none" (no login)
PUBLIC_ROLE = "analyst"                                       # only with AUTH_MODE=none: "viewer" masks name/phone/email, "analyst" shows them, "admin" also unlocks admin actions
SUPABASE_URL = "https://duotauyrrxjmqpzdjtph.supabase.co"     # Project URL (Supabase -> Project Settings -> API)
ADMIN_EMAILS = "bi_team@eduport.ai"                           # comma list: e-mails allowed to create the FIRST admin account (setup screen); afterwards admins are managed on the Access page
GITHUB_REPO = "vishnudaspeduport-a11y/eduport-lead-touch"           # manual "Sync now" button; token via: npx wrangler secret put GITHUB_TOKEN
APP_VERSION = "1.0.0"
EXPORT_ROW_CAP = "50000"

# Local dev overrides live in .dev.vars (git-ignored), e.g. AUTH_MODE=dev, DATABASE_URL=...
