<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Eduport · Lead Touch Analytics</title>
    <link rel="icon" type="image/png" href="/eduport-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // light by default (the design is light-first); dark only when the user chose it
      try { if (localStorage.getItem('lt-theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
  </head>
  <body class="text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
