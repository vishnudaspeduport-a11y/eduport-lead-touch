# Salesforce + production DB -> Supabase, every 4 hours, then refresh the MVs.
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   SF_CLIENT_ID, SF_CLIENT_SECRET, SF_LOGIN_URL, DATABASE_URL, SOURCE_DATABASE_URL
# Manual runs: Actions -> "sync" -> Run workflow (tick "full" for a full reload).
name: sync
on:
  schedule:
    - cron: '15 */4 * * *'   # every 4 hours UTC = 05:45, 09:45, 13:45, 17:45, 21:45, 01:45 IST
  workflow_dispatch:
    inputs:
      full:
        description: 'Full reload (ignore watermarks)'
        type: boolean
        default: false
      objects:
        description: 'Comma list to restrict (blank = all)'
        type: string
        default: ''
      sql:
        description: 'Ops only: run this SQL against the analytics DB instead of syncing'
        type: string
        default: ''
      target:
        description: 'Ops only: which DB the SQL runs on'
        type: choice
        options: [supabase, source]
        default: supabase
concurrency:
  group: lead-touch-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run: { working-directory: sync }
    env:
      SF_LOGIN_URL: ${{ secrets.SF_LOGIN_URL || 'https://login.salesforce.com' }}
      SF_MY_DOMAIN: ${{ vars.SF_MY_DOMAIN }}
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
      SF_SECURITY_TOKEN: ${{ secrets.SF_SECURITY_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
      UJRA_DATABASE_URL: ${{ secrets.UJRA_DATABASE_URL }}
      METABASE_URL: ${{ secrets.METABASE_URL }}
      METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
      LEAD_SINCE: ${{ vars.LEAD_SINCE || '2025-04-01T00:00:00Z' }}
      CALLS_SINCE: ${{ vars.CALLS_SINCE || '' }}
      STAGE_HISTORY_SINCE: ${{ vars.STAGE_HISTORY_SINCE || '' }}
      TASK_SINCE: ${{ vars.TASK_SINCE || '2026-01-01T00:00:00Z' }}
      SYNC_OBJECTS: ${{ inputs.objects }}
      SKIP_OBJECTS: ${{ vars.SKIP_OBJECTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sync/package-lock.json }
      - run: npm ci
      - name: Ad-hoc SQL (ops)
        if: inputs.sql != ''
        env:
          ADHOC_SQL: ${{ inputs.sql }}
          ADHOC_TARGET: ${{ inputs.target }}
        run: npx tsx src/query.ts
      - name: Sync
        if: inputs.sql == ''
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then npm run sync:full; else npm run sync; fi
